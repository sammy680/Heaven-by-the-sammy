<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- SEO Tags -->
  <meta name="description"
    content="Heaven by The Sammy's – Unleash Your Aura in Style. Luxury fashion for Gen-Z and Millennials." />
  <meta name="keywords" content="Heaven by The Sammy's, fashion, luxury clothing, Gen-Z style, e-commerce" />
  <meta name="author" content="The Sammy's" />

  <!-- Favicon -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

  <!-- Preconnect for Google Fonts (faster loading) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Google Fonts (e.g., Poppins + Playfair Display for luxury look) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@500;700&display=swap"
    rel="stylesheet" />

  <!-- Title -->
  <title>Heaven by The Sammy's | Luxury Fashion Store</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <!-- Root App Mount -->
  <div id="root"></div>

  <!-- AOS Animation CSS -->
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />

  <!-- Lottie Player (for advanced animations) -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

  <!-- AOS Animation JS Init -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 1000,
      once: true,
      offset: 50,
    });
  </script>
</body>

</html>
